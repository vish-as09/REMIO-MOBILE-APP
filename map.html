<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ContextMind – Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#070a15;--surface:#0d0f1e;--card:#12152a;--card2:#161929;--border:rgba(255,255,255,0.07);--purple:#6366f1;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;--text:#e5e7eb;--muted:#6b7280;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem;}
    .phone{width:370px;background:#0b0d1c;border-radius:44px;padding:12px;border:0.5px solid rgba(255,255,255,0.08);box-shadow:0 40px 100px rgba(0,0,0,0.8);}
    .notch{width:88px;height:22px;background:#0b0d1c;border-radius:0 0 14px 14px;margin:0 auto 8px;}
    .screen{background:var(--bg);border-radius:34px;overflow:hidden;height:760px;display:flex;flex-direction:column;position:relative;}

    /* Status */
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 18px 6px;flex-shrink:0;position:absolute;top:0;left:0;right:0;z-index:10;}
    .s-time{font-family:'Space Mono',monospace;font-size:11px;color:rgba(255,255,255,0.6);}
    .s-icons{display:flex;gap:5px;align-items:center;}

    /* Full map area */
    .map-full{flex:1;position:relative;overflow:hidden;}
    .map-svg{width:100%;height:100%;position:absolute;inset:0;}

    /* Floating header */
    .map-header{position:absolute;top:34px;left:0;right:0;padding:12px 16px 0;z-index:10;}
    .search-bar{background:rgba(13,15,30,0.92);border:0.5px solid rgba(255,255,255,0.12);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(10px);}
    .search-input{flex:1;background:none;border:none;outline:none;color:#e5e7eb;font-size:13px;font-family:'Sora',sans-serif;}
    .search-input::placeholder{color:#4b5563;}

    /* Map pins */
    .pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;transition:transform 0.2s;}
    .pin:hover{transform:translate(-50%,-100%) scale(1.15);}
    .pin-label{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;color:#e5e7eb;background:rgba(13,15,30,0.85);padding:3px 8px;border-radius:8px;border:0.5px solid rgba(255,255,255,0.1);}

    /* My location pulse */
    .my-loc{position:absolute;transform:translate(-50%,-50%);}
    .loc-outer{width:44px;height:44px;border-radius:50%;background:rgba(99,102,241,0.1);display:flex;align-items:center;justify-content:center;animation:locPulse 2.5s infinite;}
    .loc-inner{width:18px;height:18px;border-radius:50%;background:#6366f1;border:2.5px solid white;}
    @keyframes locPulse{0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,0.4);}50%{box-shadow:0 0 0 14px rgba(99,102,241,0);}}

    /* Ripple rings around pins */
    .ripple-ring{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:1.5px solid;animation:pinRipple 2s infinite;}
    @keyframes pinRipple{0%{width:20px;height:20px;opacity:0.7;}100%{width:60px;height:60px;opacity:0;}}

    /* Bottom sheet */
    .bottom-sheet{position:absolute;bottom:70px;left:0;right:0;padding:0 16px;z-index:10;}
    .sheet-card{background:rgba(13,15,30,0.95);border:0.5px solid rgba(255,255,255,0.1);border-radius:20px;padding:14px;backdrop-filter:blur(14px);}
    .sheet-title{font-size:12px;font-weight:600;color:#fff;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
    .sheet-count{font-size:10px;color:var(--purple);}
    .nearby-list{display:flex;flex-direction:column;gap:8px;}
    .nearby-item{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 0;border-bottom:0.5px solid rgba(255,255,255,0.05);}
    .nearby-item:last-child{border-bottom:none;padding-bottom:0;}
    .ni-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
    .ni-info{flex:1;}
    .ni-name{font-size:12px;color:#e5e7eb;font-weight:500;}
    .ni-sub{font-size:10px;color:var(--muted);}
    .ni-dist{font-size:11px;font-family:'Space Mono',monospace;color:var(--green);}

    /* Map type toggle */
    .map-toggle{position:absolute;top:108px;right:16px;display:flex;flex-direction:column;gap:6px;z-index:10;}
    .mt-btn{width:36px;height:36px;border-radius:10px;background:rgba(13,15,30,0.9);border:0.5px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);}
    .mt-btn:hover{background:rgba(99,102,241,0.15);}

    /* Bottom Nav */
    .bottom-nav{position:absolute;bottom:0;left:0;right:0;background:rgba(10,12,26,0.97);border-top:0.5px solid rgba(255,255,255,0.07);display:flex;padding:10px 0 16px;border-radius:0 0 34px 34px;z-index:50;}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-decoration:none;}
    .nav-label{font-size:9px;color:#4b5563;letter-spacing:0.3px;font-family:'Sora',sans-serif;}
    .nav-item.active .nav-label{color:#6366f1;}
    .nav-dot{width:4px;height:4px;border-radius:50%;background:#6366f1;margin:0 auto;margin-top:-1px;display:none;}
    .nav-item.active .nav-dot{display:block;}

    .toast{position:absolute;bottom:85px;left:50%;transform:translateX(-50%) translateY(30px);background:#1a1d36;border:0.5px solid rgba(99,102,241,0.35);color:#a5b4fc;font-size:11px;padding:8px 18px;border-radius:20px;opacity:0;transition:all 0.3s;white-space:nowrap;z-index:99;pointer-events:none;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  </style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="screen">

    <!-- Full map -->
    <div class="map-full">

      <!-- SVG Map background -->
      <svg class="map-svg" viewBox="0 0 346 700" xmlns="http://www.w3.org/2000/svg">
        <!-- base -->
        <rect width="346" height="700" fill="#0b1020"/>
        <!-- grid -->
        <defs>
          <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
            <path d="M32 0L0 0 0 32" fill="none" stroke="rgba(99,102,241,0.12)" stroke-width="0.4"/>
          </pattern>
        </defs>
        <rect width="346" height="700" fill="url(#g)"/>

        <!-- Roads - horizontal -->
        <rect x="0" y="160" width="346" height="14" fill="rgba(255,255,255,0.04)" rx="2"/>
        <rect x="0" y="310" width="346" height="18" fill="rgba(255,255,255,0.05)" rx="2"/>
        <rect x="0" y="480" width="346" height="12" fill="rgba(255,255,255,0.03)" rx="2"/>
        <!-- Roads - vertical -->
        <rect x="80" y="0" width="12" height="700" fill="rgba(255,255,255,0.03)" rx="2"/>
        <rect x="200" y="0" width="18" height="700" fill="rgba(255,255,255,0.05)" rx="2"/>
        <rect x="290" y="0" width="10" height="700" fill="rgba(255,255,255,0.03)" rx="2"/>

        <!-- Blocks / buildings -->
        <rect x="20" y="30" width="50" height="120" rx="4" fill="rgba(30,32,60,0.9)" stroke="rgba(99,102,241,0.15)" stroke-width="0.5"/>
        <rect x="100" y="40" width="90" height="110" rx="4" fill="rgba(28,35,58,0.9)" stroke="rgba(59,130,246,0.15)" stroke-width="0.5"/>
        <rect x="220" y="20" width="60" height="130" rx="4" fill="rgba(30,32,60,0.9)" stroke="rgba(99,102,241,0.1)" stroke-width="0.5"/>
        <rect x="305" y="50" width="35" height="100" rx="4" fill="rgba(25,30,52,0.9)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>

        <rect x="10" y="185" width="60" height="110" rx="4" fill="rgba(28,35,58,0.9)" stroke="rgba(16,185,129,0.12)" stroke-width="0.5"/>
        <rect x="100" y="190" width="88" height="105" rx="4" fill="rgba(30,32,60,0.9)" stroke="rgba(99,102,241,0.1)" stroke-width="0.5"/>
        <rect x="220" y="185" width="60" height="115" rx="4" fill="rgba(25,30,52,0.9)" stroke="rgba(245,158,11,0.1)" stroke-width="0.5"/>
        <rect x="305" y="190" width="35" height="108" rx="4" fill="rgba(28,35,58,0.9)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>

        <rect x="10" y="340" width="60" height="125" rx="4" fill="rgba(30,32,60,0.9)" stroke="rgba(99,102,241,0.12)" stroke-width="0.5"/>
        <rect x="100" y="335" width="88" height="130" rx="4" fill="rgba(26,32,55,0.9)" stroke="rgba(59,130,246,0.1)" stroke-width="0.5"/>
        <rect x="220" y="340" width="58" height="125" rx="4" fill="rgba(28,35,58,0.9)" stroke="rgba(16,185,129,0.1)" stroke-width="0.5"/>
        <rect x="305" y="345" width="36" height="120" rx="4" fill="rgba(25,30,52,0.9)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>

        <rect x="10" y="500" width="60" height="90" rx="4" fill="rgba(28,35,58,0.9)" stroke="rgba(99,102,241,0.08)" stroke-width="0.5"/>
        <rect x="100" y="505" width="88" height="85" rx="4" fill="rgba(30,32,60,0.9)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
        <rect x="220" y="498" width="60" height="90" rx="4" fill="rgba(25,30,52,0.9)" stroke="rgba(245,158,11,0.08)" stroke-width="0.5"/>

        <!-- Park / green space -->
        <rect x="10" y="605" width="326" height="80" rx="6" fill="rgba(16,185,129,0.05)" stroke="rgba(16,185,129,0.1)" stroke-width="0.5"/>
        <circle cx="60" cy="645" r="18" fill="rgba(16,185,129,0.07)"/>
        <circle cx="130" cy="635" r="12" fill="rgba(16,185,129,0.06)"/>
        <circle cx="200" cy="648" r="20" fill="rgba(16,185,129,0.07)"/>
        <circle cx="280" cy="638" r="15" fill="rgba(16,185,129,0.06)"/>

        <!-- Road labels -->
        <text x="173" y="320" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="8" font-family="Sora">MG Road</text>
        <text x="173" y="158" text-anchor="middle" fill="rgba(255,255,255,0.15)" font-size="7" font-family="Sora">Krishna Nagar Rd</text>
      </svg>

      <!-- Map controls -->
      <div class="map-toggle">
        <div class="mt-btn" onclick="showToast('Satellite view coming soon!')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="14" height="14" rx="2" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/><rect x="4" y="4" width="3" height="3" rx="0.5" fill="rgba(255,255,255,0.4)"/><rect x="9" y="4" width="3" height="3" rx="0.5" fill="rgba(255,255,255,0.4)"/><rect x="4" y="9" width="3" height="3" rx="0.5" fill="rgba(255,255,255,0.4)"/><rect x="9" y="9" width="3" height="3" rx="0.5" fill="rgba(255,255,255,0.4)"/></svg>
        </div>
        <div class="mt-btn" onclick="centerMap()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" stroke-linecap="round"/></svg>
        </div>
        <div class="mt-btn" onclick="showToast('Zooming in...')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 4v8M4 8h8" stroke="rgba(255,255,255,0.5)" stroke-width="1.4" stroke-linecap="round"/></svg>
        </div>
        <div class="mt-btn" onclick="showToast('Zooming out...')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 8h8" stroke="rgba(255,255,255,0.5)" stroke-width="1.4" stroke-linecap="round"/></svg>
        </div>
      </div>

      <!-- My location -->
      <div class="my-loc" style="left:50%;top:55%;">
        <div class="loc-outer"><div class="loc-inner"></div></div>
      </div>

      <!-- Pin: D-Mart -->
      <div class="pin" style="left:30%;top:42%;" onclick="selectPin('D-Mart','Buy Groceries','~180m')">
        <div class="ripple-ring" style="border-color:rgba(16,185,129,0.5);top:50%;left:50%;"></div>
        <svg width="28" height="34" viewBox="0 0 28 34" fill="none"><path d="M14 0C8 0 3 5 3 11c0 9 11 23 11 23S25 20 25 11C25 5 20 0 14 0z" fill="#10b981"/><circle cx="14" cy="11" r="4.5" fill="#070a15"/></svg>
        <div class="pin-label">D-Mart 🛒</div>
      </div>

      <!-- Pin: Petrol Pump -->
      <div class="pin" style="left:72%;top:28%;" onclick="selectPin('HP Petrol Pump','Check Tyre Pressure','~420m')">
        <svg width="26" height="32" viewBox="0 0 28 34" fill="none"><path d="M14 0C8 0 3 5 3 11c0 9 11 23 11 23S25 20 25 11C25 5 20 0 14 0z" fill="#f59e0b"/><circle cx="14" cy="11" r="4.5" fill="#070a15"/></svg>
        <div class="pin-label">Petrol ⛽</div>
      </div>

      <!-- Pin: Office -->
      <div class="pin" style="left:58%;top:70%;" onclick="selectPin('Office – TechPark','Work reminder active','~1.2km')">
        <svg width="26" height="32" viewBox="0 0 28 34" fill="none"><path d="M14 0C8 0 3 5 3 11c0 9 11 23 11 23S25 20 25 11C25 5 20 0 14 0z" fill="#6366f1"/><circle cx="14" cy="11" r="4.5" fill="#070a15"/></svg>
        <div class="pin-label">Office 🏢</div>
      </div>

      <!-- Pin: Hospital -->
      <div class="pin" style="left:20%;top:72%;" onclick="selectPin('City Hospital','Medicine reminder','~800m')">
        <svg width="26" height="32" viewBox="0 0 28 34" fill="none"><path d="M14 0C8 0 3 5 3 11c0 9 11 23 11 23S25 20 25 11C25 5 20 0 14 0z" fill="#ef4444"/><circle cx="14" cy="11" r="4.5" fill="#070a15"/></svg>
        <div class="pin-label">Hospital 🏥</div>
      </div>

      <!-- Floating search -->
      <div class="map-header">
        <div class="search-bar">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="rgba(255,255,255,0.35)" stroke-width="1.3"/><path d="M11 11l3 3" stroke="rgba(255,255,255,0.35)" stroke-width="1.3" stroke-linecap="round"/></svg>
          <input class="search-input" placeholder="Search location or reminder…"/>
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M5 8h6M7 12h2" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" stroke-linecap="round"/></svg>
        </div>
      </div>

      <!-- Bottom nearby sheet -->
      <div class="bottom-sheet">
        <div class="sheet-card">
          <div class="sheet-title">
            Nearby Triggers
            <span class="sheet-count" id="sheet-count">4 locations active</span>
          </div>
          <div class="nearby-list" id="nearby-list">
            <div class="nearby-item" onclick="selectPin('D-Mart','Buy Groceries','~180m')">
              <div class="ni-icon" style="background:rgba(16,185,129,0.12);">🛒</div>
              <div class="ni-info"><div class="ni-name">D-Mart</div><div class="ni-sub">Buy Groceries</div></div>
              <div class="ni-dist">~180m</div>
            </div>
            <div class="nearby-item" onclick="selectPin('HP Petrol Pump','Check Tyre Pressure','~420m')">
              <div class="ni-icon" style="background:rgba(245,158,11,0.12);">⛽</div>
              <div class="ni-info"><div class="ni-name">HP Petrol Pump</div><div class="ni-sub">Check Tyre Pressure</div></div>
              <div class="ni-dist">~420m</div>
            </div>
            <div class="nearby-item" onclick="selectPin('City Hospital','Medicine reminder','~800m')">
              <div class="ni-icon" style="background:rgba(239,68,68,0.1);">🏥</div>
              <div class="ni-info"><div class="ni-name">City Hospital</div><div class="ni-sub">Medicine reminder</div></div>
              <div class="ni-dist">~800m</div>
            </div>
            <div class="nearby-item" onclick="selectPin('Office – TechPark','Work reminder','~1.2km')">
              <div class="ni-icon" style="background:rgba(99,102,241,0.12);">🏢</div>
              <div class="ni-info"><div class="ni-name">Office – TechPark</div><div class="ni-sub">Work reminder</div></div>
              <div class="ni-dist">~1.2km</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <a class="nav-item" href="dashboard.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 12l9-9 9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" stroke-linecap="round"/></svg><span class="nav-label">Home</span><div class="nav-dot"></div></a>
      <a class="nav-item" href="alerts.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" stroke-linecap="round"/></svg><span class="nav-label">Alerts</span><div class="nav-dot"></div></a>
      <a class="nav-item active" href="map.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/><line x1="8" y1="2" x2="8" y2="18" stroke="#6366f1" stroke-width="1.5"/><line x1="16" y1="6" x2="16" y2="22" stroke="#6366f1" stroke-width="1.5"/></svg><span class="nav-label" style="color:#6366f1">Map</span><div class="nav-dot"></div></a>
      <a class="nav-item" href="stats.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><line x1="18" y1="20" x2="18" y2="10" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="20" x2="12" y2="4" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" stroke-linecap="round"/><line x1="6" y1="20" x2="6" y2="14" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" stroke-linecap="round"/></svg><span class="nav-label">Stats</span><div class="nav-dot"></div></a>
      <a class="nav-item" href="profile.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/><path d="M4 20c0-4 3.582-7 8-7s8 3 8 7" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" stroke-linecap="round"/></svg><span class="nav-label">Profile</span><div class="nav-dot"></div></a>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>
<script>
  function updateClock(){var n=new Date(),h=n.getHours().toString().padStart(2,'0'),m=n.getMinutes().toString().padStart(2,'0');document.getElementById('clock').textContent=h+':'+m;}
  updateClock();setInterval(updateClock,1000);
  function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
  function selectPin(name,reminder,dist){showToast('📍 '+name+' — '+reminder+' ('+dist+')');}
  function centerMap(){showToast('📍 Centered on your location');}
</script>
</body>
</html>
