<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ContextMind – Map</title>

  <!-- FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- LEAFLET (FREE MAP) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body{margin:0;font-family:'Sora',sans-serif;background:#070a15;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;}
    .phone{width:370px;background:#0b0d1c;border-radius:40px;padding:10px;}
    .screen{height:760px;border-radius:30px;overflow:hidden;position:relative;}

    #map{position:absolute;inset:0;}

    /* SEARCH */
    .map-header{position:absolute;top:20px;left:0;right:0;padding:0 16px;z-index:10;}
    .search-bar{background:#0d0f1e;border-radius:12px;padding:10px;}
    .search-input{width:100%;background:none;border:none;color:white;outline:none;}

    /* BUTTONS */
    .map-toggle{position:absolute;top:90px;right:10px;z-index:10;}
    .mt-btn{background:#0d0f1e;padding:10px;margin:5px;border-radius:10px;cursor:pointer;}

    /* BOTTOM */
    .bottom-sheet{position:absolute;bottom:20px;left:0;right:0;padding:10px;z-index:10;}
    .sheet-card{background:#0d0f1e;border-radius:15px;padding:10px;}

    .toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1d36;padding:8px 16px;border-radius:20px;opacity:0;transition:0.3s;}
    .toast.show{opacity:1;}
  </style>
</head>

<body>

<div class="phone">
  <div class="screen">

    <!-- REAL FREE MAP -->
    <div id="map"></div>

    <!-- SEARCH -->
    <div class="map-header">
      <div class="search-bar">
        <input class="search-input" placeholder="Search location... (city name)"/>
      </div>
    </div>

    <!-- BUTTONS -->
    <div class="map-toggle">
      <div class="mt-btn" onclick="centerMap()">📍</div>
      <div class="mt-btn" onclick="zoomIn()">➕</div>
      <div class="mt-btn" onclick="zoomOut()">➖</div>
    </div>

    <!-- BOTTOM -->
    <div class="bottom-sheet">
      <div class="sheet-card">
        Free Map Active ✅ (OpenStreetMap)
      </div>
    </div>

    <div class="toast" id="toast"></div>

  </div>
</div>

<script>
let map;
let marker;

// INIT MAP (Delhi default)
map = L.map('map').setView([28.6139, 77.2090], 13);

// TILE (FREE MAP)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

// USER LOCATION
navigator.geolocation.getCurrentPosition(function(pos){
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;

  map.setView([lat, lng], 14);

  marker = L.marker([lat, lng]).addTo(map)
    .bindPopup("You are here")
    .openPopup();
});

// SEARCH (simple city search using Nominatim)
document.querySelector(".search-input").addEventListener("change", function(){
  const query = this.value;

  fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}`)
    .then(res => res.json())
    .then(data => {
      if(data.length === 0){
        showToast("Location not found ❌");
        return;
      }

      const lat = data[0].lat;
      const lon = data[0].lon;

      map.setView([lat, lon], 14);

      if(marker) map.removeLayer(marker);

      marker = L.marker([lat, lon]).addTo(map)
        .bindPopup(query)
        .openPopup();
    });
});

// CONTROLS
function centerMap(){
  navigator.geolocation.getCurrentPosition((pos)=>{
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    map.setView([lat, lng], 14);

    if(marker) map.removeLayer(marker);

    marker = L.marker([lat, lng]).addTo(map)
      .bindPopup("You are here")
      .openPopup();
  });
}

function zoomIn(){ map.zoomIn(); }
function zoomOut(){ map.zoomOut(); }

// TOAST
function showToast(msg){
  const t=document.getElementById("toast");
  t.innerText=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2000);
}
</script>

</body>
</html>
